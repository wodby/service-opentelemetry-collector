# OpenTelemetry Collector (contrib distribution).
# Reference: https://opentelemetry.io/docs/collector/configuration/
#
# Each signal goes to the destination its link sets: traces, metrics or logs, otherwise upstream. The links set
# OTLP_<SIGNAL>_ENDPOINT, OTLP_<SIGNAL>_AUTHORIZATION and OTLP_<SIGNAL>_EXPORTERS. A signal without a destination is
# dropped by the nop exporter; its otlp_http exporter keeps a placeholder address so the configuration stays valid.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Every OTLP request must send "Authorization: Bearer <ingest token>".
  bearertokenauth:
    token: ${env:OTLP_INGEST_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Refuse data before the container runs out of memory.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  nop: {}
  otlp_http/traces:
    endpoint: ${env:OTLP_TRACES_ENDPOINT:-http://0.0.0.0:9}
    headers:
      Authorization: ${env:OTLP_TRACES_AUTHORIZATION:-}
  otlp_http/metrics:
    endpoint: ${env:OTLP_METRICS_ENDPOINT:-http://0.0.0.0:9}
    headers:
      Authorization: ${env:OTLP_METRICS_AUTHORIZATION:-}
  otlp_http/logs:
    endpoint: ${env:OTLP_LOGS_ENDPOINT:-http://0.0.0.0:9}
    headers:
      Authorization: ${env:OTLP_LOGS_AUTHORIZATION:-}

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: ${env:OTLP_TRACES_EXPORTERS:-[nop]}
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: ${env:OTLP_METRICS_EXPORTERS:-[nop]}
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: ${env:OTLP_LOGS_EXPORTERS:-[nop]}
