name: opentelemetry-collector
title: OpenTelemetry Collector
guidance: GUIDANCE.md
icon: opentelemetry
type: service
scalable: true

labels:
- opentelemetry-collector
- otlp
- tracing
- observability

options:
- version: '0'
  tag: '0.164.0'
  default: true

endpoints:
- name: otlp
  ports:
  # OTLP over HTTP. It is public so applications in other environments can send telemetry; every request needs the
  # ingest token.
  - name: otlp-http
    number: 4318
    protocol: http
    main: true
  - name: otlp-grpc
    number: 4317
    protocol: tcp
    private: true

tokens:
- name: ingest_token
  generate:
    regex: '[A-Za-z0-9]{48}'

env:
- name: OTLP_INGEST_TOKEN
  value: '{{ingest_token}}'
  secret: true

links:
# Where every signal goes unless traces, metrics or logs name another destination: a Collector here, in another app,
# or a custom OTLP endpoint.
- name: upstream
  title: Upstream
  crossApp: true
  custom: true
  selectors:
  - type: service
    labels:
    - opentelemetry-collector
  values:
  - name: endpoint
    title: OTLP endpoint
    from: '{{link.exports.otlp_http_endpoint}}'
  - name: authorization
    title: Authorization header
    secret: true
    optional: true
    from: '{{link.exports.otlp_http_authorization}}'
  env:
  - name: OTLP_TRACES_ENDPOINT
    value: '{{link.values.endpoint}}'
  - name: OTLP_TRACES_AUTHORIZATION
    value: '{{link.values.authorization}}'
    secret: true
  - name: OTLP_TRACES_EXPORTERS
    value: '[otlp_http/traces]'
  - name: OTLP_METRICS_ENDPOINT
    value: '{{link.values.endpoint}}'
  - name: OTLP_METRICS_AUTHORIZATION
    value: '{{link.values.authorization}}'
    secret: true
  - name: OTLP_METRICS_EXPORTERS
    value: '[otlp_http/metrics]'
  - name: OTLP_LOGS_ENDPOINT
    value: '{{link.values.endpoint}}'
  - name: OTLP_LOGS_AUTHORIZATION
    value: '{{link.values.authorization}}'
    secret: true
  - name: OTLP_LOGS_EXPORTERS
    value: '[otlp_http/logs]'
  # Read by the forwarding configuration of app stacks released before these links.
  - name: OTLP_UPSTREAM_ENDPOINT
    value: '{{link.values.endpoint}}'
  - name: OTLP_UPSTREAM_AUTHORIZATION
    value: '{{link.values.authorization}}'
    secret: true
# Overrides upstream for traces. Declared after upstream, so its variables win.
- name: traces
  title: Traces
  crossApp: true
  custom: true
  selectors:
  - type: service
    labels:
    - opentelemetry-collector
  - type: service
    labels:
    - tempo
  values:
  - name: endpoint
    title: OTLP endpoint
    from: '{{link.exports.otlp_http_endpoint}}'
  - name: authorization
    title: Authorization header
    secret: true
    optional: true
    from: '{{link.exports.otlp_http_authorization}}'
  env:
  - name: OTLP_TRACES_ENDPOINT
    value: '{{link.values.endpoint}}'
  - name: OTLP_TRACES_AUTHORIZATION
    value: '{{link.values.authorization}}'
    secret: true
  - name: OTLP_TRACES_EXPORTERS
    value: '[otlp_http/traces]'
# Overrides upstream for metrics.
- name: metrics
  title: Metrics
  crossApp: true
  custom: true
  selectors:
  - type: service
    labels:
    - opentelemetry-collector
  - type: service
    labels:
    - victoria-metrics
  values:
  - name: endpoint
    title: OTLP endpoint
    from: '{{link.exports.otlp_http_endpoint}}'
  - name: authorization
    title: Authorization header
    secret: true
    optional: true
    from: '{{link.exports.otlp_http_authorization}}'
  env:
  - name: OTLP_METRICS_ENDPOINT
    value: '{{link.values.endpoint}}'
  - name: OTLP_METRICS_AUTHORIZATION
    value: '{{link.values.authorization}}'
    secret: true
  - name: OTLP_METRICS_EXPORTERS
    value: '[otlp_http/metrics]'
# Overrides upstream for logs.
- name: logs
  title: Logs
  crossApp: true
  custom: true
  selectors:
  - type: service
    labels:
    - opentelemetry-collector
  - type: service
    labels:
    - loki
  values:
  - name: endpoint
    title: OTLP endpoint
    from: '{{link.exports.otlp_http_endpoint}}'
  - name: authorization
    title: Authorization header
    secret: true
    optional: true
    from: '{{link.exports.otlp_http_authorization}}'
  env:
  - name: OTLP_LOGS_ENDPOINT
    value: '{{link.values.endpoint}}'
  - name: OTLP_LOGS_AUTHORIZATION
    value: '{{link.values.authorization}}'
    secret: true
  - name: OTLP_LOGS_EXPORTERS
    value: '[otlp_http/logs]'

# A Collector has to send somewhere.
linkGroups:
- name: destination
  title: Destination
  links: [upstream, traces, metrics, logs]
  min: 1

# Other Collectors, also in other apps, link to this one with these values. {{url.otlp-http}} is the address of the
# OTLP/HTTP port as the linking service reaches it.
crossApp: true
exports:
- name: otlp_http_endpoint
  value: '{{url.otlp-http}}'
- name: otlp_http_authorization
  value: 'Bearer {{tokens.ingest_token}}'
  secret: true

configs:
- name: config
  title: Collector config
  config: config.yaml
  processTokens: true
  filepath: /etc/otelcol-contrib/wodby.yaml

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/stateless
  chart: oci://registry-1.docker.io/wodby/stateless
  version: 0.4.0
  valueMappings:
    replicas: replicaCount
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create
  values:
  - name: containerName
    value: otelcol
  - name: args
    value:
    - --config=/etc/otelcol-contrib/wodby.yaml
  - name: containerPorts
    value:
    - name: otlp-http
      containerPort: 4318
      protocol: TCP
    - name: otlp-grpc
      containerPort: 4317
      protocol: TCP
    - name: health
      containerPort: 13133
      protocol: TCP
  - name: securityContext
    value:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
  # The health_check extension answers on port 13133 once every pipeline has started.
  - name: startupProbe
    value:
      httpGet:
        path: /
        port: health
      failureThreshold: 30
      periodSeconds: 2
  - name: readinessProbe
    value:
      httpGet:
        path: /
        port: health
      periodSeconds: 10
  - name: livenessProbe
    value:
      httpGet:
        path: /
        port: health
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: otelcol
    image: otel/opentelemetry-collector-contrib
    resources:
      request:
        cpu: 10
        memory: 48
      # memory_limiter refuses data above 80% of this limit; without one it would use the node's memory.
      limit:
        memory: 512
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts
